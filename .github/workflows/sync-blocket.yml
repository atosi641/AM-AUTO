name: Sync Inventory from Blocket 🚗

on:
  schedule:
    # Körs automatiskt varje hel timme
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Blocket Sync Script
        run: node scripts/sync-blocket.js

      - name: Commit and push if inventory changed
        run: |
          git config --global user.name "AM Auto Bot"
          git config --global user.email "bot@am-auto.se"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected in inventory! Committing and pushing..."
            git add lager.html bil-detaljer.html
            git commit -m "Auto-sync inventory from Blocket"
            git push origin main
          else
            echo "No changes detected. Inventory is already up-to-date."
          fi
