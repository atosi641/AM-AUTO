name: Deploy to One.com 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove git folders before deploy
        run: rm -rf .git .github

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ssh.cyqbonh8m.service.one
          username: cyqbonh8m_ssh
          password: ${{ secrets.SFTP_PASS }}
          port: 22
          source: "."
          target: "/webroots/2851b24e"
          overwrite: true
          strip_components: 0
