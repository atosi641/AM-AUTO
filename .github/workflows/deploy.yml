name: Auto Deploy One.com FTP
on:
  push:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to One.com FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.am-auto.se          # ← ÄNDRA till din riktiga FTP-host!
        username: am-auto.se            # ← Din domän som username
        password: ${{ secrets.FTP_PASS }}
        local-dir: ./
        server-dir: ./
