name: Auto-synka antigravity
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Rsync till one.com
      uses: burnett01/rsync-deployments@v7.1.0
      with:
        switches: -avzr --delete
        path: antigravity/
        remote_path: /files/
        remote_host
