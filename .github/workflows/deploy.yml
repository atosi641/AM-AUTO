name: Auto-synka antigravity
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Fixar Node 20-varning nu
    steps:
    - uses: actions/checkout@v5  # Uppdaterad till Node 24-kompatibel [web:9]
    
    - uses: burnett01/rsync-deployments@7.1.0  # Behålls - fungerar perfekt
      with:
        switches: -avzr --delete
        path: antigravity/
        remote_path: /files/
        remote_host: ${{ secrets.REMOTE_HOST }}
        remote_user: ${{ secrets.REMOTE_USER }}
        remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
