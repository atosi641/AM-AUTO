name: Deploy to One.com RSYNC
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy with rsync
      uses: burnett01/rsync-deployments@master
      with:
        remote_path: "/webroots/2851b24e/"
        remote_host: "sftp.one.com"
        remote_user: "DITT_ONE_COM_USERNAME"
        remote_key: ${{ secrets.ONE_COM_PRIVATE_KEY }}
