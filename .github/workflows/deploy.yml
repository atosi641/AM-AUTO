name: Auto Deploy One.com SFTP
on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to One.com SFTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.cyqbonh8m.service.one
        username: cyqbonh8m_ftp
        password: ${{ secrets.FTP_PASS }}
        local-dir: ./
        server-dir: /webroots/281524e/am-auto.se/
