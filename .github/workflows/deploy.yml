name: Deploy to One.com 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: |
            index.html
            home.html
            kontakt.html
            lager.html
            om-oss.html
            salj-din-bil.html
            bil-detaljer.html
            cookies-policy.html
            .htaccess
            css/**
            images/**
          target: "/webroots/2851b24e/www"
          overwrite: true
          strip_components: 0
