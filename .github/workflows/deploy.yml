name: Deploy to One.com 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove git folders before deploy
        run: rm -rf .git .github

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ssh.cyqbonh8m.service.one
          username: cyqbonh8m_ssh
          password: ${{ secrets.SFTP_PASS }}
          port: 22
          source: "."
          target: "/webroots/2851b24e"
          overwrite: true
          strip_components: 1

      - name: Find files and clear cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.cyqbonh8m.service.one
          username: cyqbonh8m_ssh
          password: ${{ secrets.SFTP_PASS }}
          port: 22
          script: |
            echo "=== WHERE IS INDEX.HTML? ==="
            find /webroots/2851b24e -name "index.html" 2>/dev/null
            echo "=== ROOT CONTENTS ==="
            ls -la /webroots/2851b24e/
            echo "=== HOME DIR ==="
            ls -la ~/
            echo "=== PWD ==="
            pwd
            echo "=== CLEAR CACHE ==="
            rm -rf /webroots/2851b24e/.cache 2>/dev/null
            echo "Done"
